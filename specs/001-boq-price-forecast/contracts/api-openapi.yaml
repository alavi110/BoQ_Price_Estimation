  # ===== Administration =====
  /admin/models/retrain:
    post:
      tags: [Administration]
      summary: Trigger forecast model retraining
      operationId: retrainModels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRetrainRequest'
      responses:
        '202':
          description: Retraining job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelRetrainResponse'

  /admin/models:
    get:
      tags: [Administration]
      summary: List forecast models
      operationId: listModels
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        component_code:
                          type: string
                        model_type:
                          type: string
                        version:
                          type: integer
                        status:
                          type: string
                        mae:
                          type: number
                        trained_at:
                          type: string
                          format: date-time

  /admin/users:
    get:
      tags: [Administration]
      summary: List users
      operationId: listUsers
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'

  /admin/projects:
    get:
      tags: [Administration]
      summary: List projects
      operationId: listProjects
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectResponse'

    post:
      tags: [Administration]
      summary: Create new project
      operationId: createProject
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  /admin/projects/{project_id}:
    get:
      tags: [Administration]
      summary: Get project details
      operationId: getProject
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      tags: [Administration]
      summary: Update project settings
      operationId: updateProject
      security:
        - BearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                risk_buffer:
                  type: number
                  format: double
                payment_terms:
                  type: number
                  format: double
                profit_margin:
                  type: number
                  format: double
                fusion_alpha:
                  type: number
                  format: double
                status:
                  type: string
                  enum: [draft, active, archived]
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'

  # ===== Health =====
  /health:
    get:
      tags: [Health]
      summary: Health check endpoint
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                      redis:
                        type: string
                      openrouter:
                        type: string
                      market_data:
                        type: string