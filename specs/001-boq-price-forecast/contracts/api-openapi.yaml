      operationId: listMarketDataSources
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of market data sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/MarketDataSourceStatus'

  /market-data/etl/trigger:
    post:
      tags: [Market Data]
      summary: Manually trigger ETL for sources
      operationId: triggerETL
