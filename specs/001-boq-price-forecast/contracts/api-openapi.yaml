      security:
        - BearerAuth: []
      responses:
        '200':
          description: Market data freshness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketDataFreshness'

  /market-data/sources:
    get:
      tags: [Market Data]
