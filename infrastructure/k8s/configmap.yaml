apiVersion: v1
kind: ConfigMap
metadata:
  name: boq-config
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/part-of: boq-price-forecast
data:
  # Application
  APP_NAME: "BoQ Price Forecast"
  VERSION: "0.1.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  FORCE_HTTPS: "true"
  TRUST_PROXY_HEADERS: "true"
  ALLOWED_HOSTS: "api.bidprice-estimator.local"

  # Database (URL is in Secret)
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"

  # Redis (URL is in Secret)
  # Celery (URL is in Secret)

  # Security (keys in Secret)
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

  # OpenRouter / LLM
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  DEFAULT_LLM_MODEL: "openai/gpt-4o"
  LLM_TIMEOUT_SECONDS: "30"
  LLM_MAX_RETRIES: "3"
  LLM_RETRY_BASE_SECONDS: "1.0"
  LLM_RETRY_MAX_SECONDS: "30.0"
  OPENROUTER_SITE_URL: "https://bidprice-estimator.local"
  OPENROUTER_APP_NAME: "BoQ Price Estimator"

  # ML Models
  ML_MODEL_PATH: "/app/model_artifacts"
  FORECAST_MODEL_PATH: "/app/model_artifacts/forecast"
  WEIGHT_FUSION_ALPHA: "0.7"

  # ETL
  ETL_SCHEDULE_CRON: "0 2 * * *"
  ETL_TIMEZONE: "Asia/Tehran"
  MARKET_DATA_STALENESS_HOURS: "24"
  ETL_MAX_ATTEMPTS: "3"
  ETL_RETRY_BASE_SECONDS: "2.0"

  # Forecast
  FORECAST_HORIZONS: "[1, 3, 6, 12]"
  FORECAST_SCENARIOS: '["optimistic", "base", "pessimistic"]'
  FORECAST_CONFIDENCE_LEVEL: "0.8"
  MODEL_RETRAIN_SCHEDULE_CRON: "0 3 * * 0"
  RETRAIN_SKIP_IF_STALE_HOURS: "72"

  # Commercial Adjustments
  DEFAULT_RISK_BUFFER: "1.04"
  DEFAULT_PAYMENT_TERMS: "1.08"
  DEFAULT_PROFIT_MARGIN: "1.10"

  # Export
  EXPORT_STORAGE_PATH: "/app/exports"
  PDF_FONT_PATH: "/usr/share/fonts/truetype/vazirmatn/Vazirmatn-Regular.ttf"

  # CORS
  ALLOWED_ORIGINS: '["https://bidprice-estimator.local", "https://app.bidprice-estimator.local"]'

  # Rate Limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  RATE_LIMIT_ENABLED: "true"

  # Observability
  METRICS_ENABLED: "true"

  # File Upload
  MAX_FILE_SIZE_MB: "50"
  ALLOWED_EXTENSIONS: '[".xlsx", ".xls"]'