apiVersion: apps/v1
kind: Deployment
metadata:
  name: boq-frontend
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: boq-price-forecast
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boq-price-forecast
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: boq-price-forecast/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.bidprice-estimator.local"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: boq-frontend
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: frontend