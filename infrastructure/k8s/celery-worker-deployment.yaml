apiVersion: apps/v1
kind: Deployment
metadata:
  name: boq-celery-worker
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: boq-price-forecast
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boq-price-forecast
        app.kubernetes.io/component: celery-worker
    spec:
      serviceAccountName: boq-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: boq-price-forecast/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - src.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: boq-config
            - secretRef:
                name: boq-secrets
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: boq-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: exports
              mountPath: /app/exports
            - name: model-artifacts
              mountPath: /app/model_artifacts
      volumes:
        - name: exports
          persistentVolumeClaim:
            claimName: boq-exports-pvc
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: boq-model-artifacts-pvc