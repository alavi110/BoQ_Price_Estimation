apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boq-exports-pvc
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boq-model-artifacts-pvc
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boq-beat-data-pvc
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard