apiVersion: apps/v1
kind: Deployment
metadata:
  name: boq-backend
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: boq-price-forecast
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: boq-price-forecast
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boq-price-forecast
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: boq-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: boq-price-forecast/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: boq-config
            - secretRef:
                name: boq-secrets
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: boq-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: exports
              mountPath: /app/exports
            - name: model-artifacts
              mountPath: /app/model_artifacts
      volumes:
        - name: exports
          persistentVolumeClaim:
            claimName: boq-exports-pvc
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: boq-model-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: boq-backend
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/component: backend