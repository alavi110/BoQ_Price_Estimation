apiVersion: v1
kind: Secret
metadata:
  name: boq-secrets
  namespace: boq-price-forecast
  labels:
    app.kubernetes.io/name: boq-price-forecast
    app.kubernetes.io/part-of: boq-price-forecast
type: Opaque
# Base64 encoded values - replace with actual values before applying
# Generate with: echo -n 'your-value' | base64
stringData:
  # Database
  DATABASE_URL: "postgresql+asyncpg://boq_user:CHANGE_ME@postgres:5432/boq_price_forecast"

  # Redis
  REDIS_URL: "redis://redis:6379/0"

  # Celery
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  # Security
  JWT_SECRET_KEY: "CHANGE_ME_MIN_32_CHARS"
  # OPENROUTER_API_KEY is set from external secret manager in production

  # Market Data Sources (optional)
  # IME_API_KEY: ""
  # CENTRAL_BANK_API_KEY: ""
  # ENERGY_PORTAL_CREDENTIALS: ""